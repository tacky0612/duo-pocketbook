          type: integer
      type: object
    web.directTransferDTO:
      properties:
        amountYen:
          example: 5000
          type: integer
        description:
          example: 立替の返済
          type: string
        from:
          example: acct_9f3c1a2b7d4e5f60
          type: string
        id:
          example: 2026-07_a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8
          type: string
        month:
          example: 2026-07
          type: string
        recurring:
          example: false
          type: boolean
        to:
