          uniqueItems: false
        members:
          items:
            $ref: '#/components/schemas/web.settlementMemberDTO'
          type: array
          uniqueItems: false
        month:
          example: 2026-07
          type: string
        settled:
          example: false
          type: boolean
        settlementTransfer:
          $ref: '#/components/schemas/web.transferDTO'
        totalDirectTransferYen:
          description: TotalDirectTransferYen は当月に適用された立替精算の総額（方向を問わない絶対額の合計）。
          example: 5000
          type: integer
        totalExpenseYen:
          example: 40000
          type: integer
        transfer:
          $ref: '#/components/schemas/web.transferDTO'
      type: object
    web.settlementStatusRequest:
      properties:
        settled:
          example: true
          type: boolean
      type: object
    web.settlementStatusResponse:
      properties:
        month:
          example: 2026-07
          type: string
        settled:
          example: true
          type: boolean
      type: object
    web.skipReservationRequest:
      properties:
        month:
          example: 2026-10
          type: string
        skipped:
          example: true
          type: boolean
      type: object
    web.snapshotDirectTransferDTO:
      properties:
        amountYen:
          example: 5000
          type: integer
        description:
          example: 立替分
          type: string
        from:
          example: acct_9f3c1a2b7d4e5f60
          type: string
        recurring:
          example: false
          type: boolean
        to:
          example: acct_1a2b3c4d5e6f7a8b
          type: string
      type: object
    web.snapshotExpenseDTO:
      properties:
        amountYen:
          example: 80000
          type: integer
        date:
          example: "2026-07-03"
          type: string
        description:
          example: 家賃
          type: string
        paidBy:
          example: acct_9f3c1a2b7d4e5f60
          type: string
        recurring:
          example: false
          type: boolean
