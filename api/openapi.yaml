            $ref: '#/components/schemas/web.snapshotDirectTransferDTO'
          type: array
          uniqueItems: false
        expenses:
          items:
            $ref: '#/components/schemas/web.snapshotExpenseDTO'
          type: array
          uniqueItems: false
        members:
          items:
            $ref: '#/components/schemas/web.settlementMemberDTO'
          type: array
          uniqueItems: false
        month:
          example: 2026-07
          type: string
        settledAt:
          example: "2026-07-31T12:00:00Z"
          type: string
        settlementTransfer:
