          description: Month は空文字なら毎月継続、"YYYY-MM" ならその精算月のみの単発として登録する。
          example: 2026-07
          type: string
      type: object
    web.registerRecurringExpenseRequest:
      properties:
        amountYen:
          example: 80000
          type: integer
        description:
          example: 家賃
          type: string
        paidBy:
          example: acct_9f3c1a2b7d4e5f60
          type: string
      type: object
    web.registerReservationRequest:
      properties:
        description:
          example: 電気代
          type: string
        kind:
          description: Kind は "expense"（支出の予約）か "income"（収入の予約）。更新時は無視される。
          enum:
          - expense
          - income
          example: expense
