          $ref: '#/components/schemas/web.transferDTO'
      type: object
    web.settlementHistoryResponse:
      properties:
        entries:
          items:
            $ref: '#/components/schemas/web.settlementHistoryEntryDTO'
          type: array
          uniqueItems: false
      type: object
    web.settlementMemberDTO:
      properties:
        disposableYen:
          example: 55000
          type: integer
        id:
          example: acct_9f3c1a2b7d4e5f60
