          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.errorResponse'
          description: 精算確定済みの月 (MONTH_SETTLED)
      security:
      - BearerAuth: []
      summary: 予約の更新
      tags:
      - reservations
  /reservations/{id}/fulfill:
    post:
      description: |-
        確定した金額を入力し、予約を実データとして登録する。支出の予約は共有支出（date の日付）、収入の予約はその月のみの追加収入として登録され、精算に反映される。
        登録された支出・収入は reservationId で予約と紐づき、通常の支出・収入と同様に編集・削除できる（削除すると予約は未入力に戻る）。
        既に入力済みの月には入力できない（400）。同時入力・再送による二重登録も「予約×月」の入力ロックで防ぎ、後着側は 400 になる。スキップ済みだった場合はスキップを解除する。
      parameters:
      - description: 予約ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/web.fulfillReservationRequest'
                description: 確定した金額
                summary: body
        description: 確定した金額
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.reservationDTO'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.errorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.errorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.errorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.errorResponse'
          description: 精算確定済みの月 (MONTH_SETTLED)
      security:
      - BearerAuth: []
      summary: 予約の金額入力
      tags:
      - reservations
  /reservations/{id}/skip:
    put:
      description: |-
        毎月の予約が指定精算月には発生しないことを記録する（skipped=false で解除）。スキップ済みの予約は未入力として数えない。
        今月だけ（単発）の予約と入力済みの予約はスキップできない（400）。単発の予約が不要になった場合は削除する。解除は単発でも行える。
      parameters:
      - description: 予約ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
