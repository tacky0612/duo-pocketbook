          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.errorResponse'
          description: 精算確定済みの月 (MONTH_SETTLED)
      security:
      - BearerAuth: []
      summary: 予約の削除
      tags:
      - reservations
    put:
      description: |-
        メンバー・内容・頻度（month が空なら毎月、指定するとその精算月のみ）を更新する。種別は変更できない。
        頻度を変えても予約IDは変わらず、予約から登録済みの支出・収入との紐づけもそのまま有効。単発へ変更すると「今月はなし」の記録は消える。
        レスポンスは予約の内容のみを表し、status 等の入力状況は反映しない（月ごとの入力状況は一覧 API で取得する）。
      parameters:
      - description: 予約ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/web.registerReservationRequest'
                description: 予約
                summary: body
        description: 予約
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.reservationDTO'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.errorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
