        kind:
          description: Kind は "expense"（支出の予約）か "income"（収入の予約）。
          enum:
          - expense
          - income
          example: expense
          type: string
        memberId:
          description: MemberID は支出なら支払う人、収入なら収入を得る人。
          example: acct_9f3c1a2b7d4e5f60
          type: string
        month:
          description: 毎月は空文字
          example: ""
          type: string
        recurring:
          example: true
          type: boolean
        startMonth:
          description: StartMonth は毎月の予約の開始月。これより前の月には現れない。空文字は制限なし（単発は常に空文字）。
          example: 2026-10
          type: string
        status:
          description: Status は指定精算月の入力状況。pending=未入力 / fulfilled=入力済み / skipped=今月はなし。
          enum:
          - pending
          - fulfilled
          - skipped
          example: pending
          type: string
      type: object
    web.reservationsResponse:
      properties:
        month:
          example: 2026-10
          type: string
        pendingCount:
          description: PendingCount は未入力（status=pending）の予約の件数。精算確定前の警告に使う。
          example: 1
          type: integer
        reservations:
          items:
            $ref: '#/components/schemas/web.reservationDTO'
