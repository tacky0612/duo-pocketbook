          example: 'validation error: 金額は1円以上で入力してください'
          type: string
      type: object
    web.errorResponse:
      properties:
        error:
          $ref: '#/components/schemas/web.errorBody'
      type: object
    web.expenseDTO:
      properties:
        amountYen:
          example: 20000
          type: integer
        createdAt:
          example: "2026-07-01T09:00:00Z"
          type: string
        date:
          example: "2026-07-01"
          type: string
        description:
          example: 家賃
          type: string
        id:
          example: 2026-07_a1b2c3d4e5f6a7b8a1b2c3d4e5f6a7b8
          type: string
        month:
          example: 2026-07
          type: string
        paidBy:
          example: acct_9f3c1a2b7d4e5f60
