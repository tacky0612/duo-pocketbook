          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.errorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.errorResponse'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.errorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.errorResponse'
          description: 精算確定済みの月 (MONTH_SETTLED)
      security:
      - BearerAuth: []
      summary: 予約のスキップ（今月はなし）
      tags:
      - reservations
