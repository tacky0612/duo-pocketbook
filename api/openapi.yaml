  /reservations/{id}:
    delete:
      description: 予約を削除する。予約から登録済みの支出・収入は削除されずに残る。
      parameters:
      - description: 予約ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: 削除成功
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/web.errorResponse'
          description: Unauthorized
        "404":
