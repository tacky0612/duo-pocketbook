        month:
          description: Month は空文字なら毎月、"YYYY-MM" ならその精算月のみの単発。更新時も指定した頻度へ変更する。
          example: ""
          type: string
        startMonth:
          description: |-
            StartMonth は毎月の予約の開始月（"YYYY-MM"）。これより前の月には現れない。登録時に空なら制限なし。
            更新時に空なら、毎月のままは現在の開始月、単発から毎月へ変えるなら元の対象月を開始月にする。
          example: 2026-10
          type: string
      type: object
